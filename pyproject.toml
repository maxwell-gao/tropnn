[project]
name = "tropnn"
version = "0.1.0"
description = "Minimal pairwise comparison lookup-table neural layer library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Senquan(Maxwell) Gao" }
]
keywords = ["pairwise", "lookup-table", "neural-network", "torch", "teaching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.2.6",
    "tilelang>=0.1.9",
    "torch>=2.9.1",
]

[project.optional-dependencies]
cpu = [
    "ziglang==0.16.0",
]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.1.0",
]

[project.scripts]
tropnn-emnist = "tropnn.examples.emnist:main"
tropnn-recovery-lut-structures = "tropnn.examples.recovery_lut_structures:main"
tropnn-scaling-benchmark = "tropnn.tools.scaling_benchmark:main"
tropnn-dense-projection-fit = "tropnn.tools.dense_projection_fit:main"
tropnn-anchor-policy-benchmark = "tropnn.tools.anchor_policy_benchmark:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
tropnn = ["kernels/src/*.zig"]

[tool.setuptools.package-dir]
tropnn = "."

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
